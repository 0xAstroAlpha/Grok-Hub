<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
    <title>Grok-Hub</title>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark"><img src="icon.png" alt="Logo" width="34" height="34" /></span>
        <div class="brand__text">
          <h1>Grok-Hub</h1>
          <p>Account Manager</p>
        </div>
      </div>
      <span class="count-pill"><b id="count">0</b> acc</span>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-panel="list" type="button">Accounts</button>
      <button class="tab" data-panel="manage" type="button">Manage</button>
      <button class="tab" data-panel="history" type="button">History</button>
    </nav>

    <section id="panel-list" class="panel is-active">
      <ul id="accountList" class="list"></ul>
    </section>

    <section id="panel-manage" class="panel">
      <label class="field-label" for="accounts">
        List of <span>email|password per line</span>
      </label>
      <textarea id="accounts" spellcheck="false" placeholder="email@example.com|password"></textarea>
      <div class="toolbar">
        <button id="save" class="btn btn--primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 4h11l3 3v13H5z M9 4v5h6M8 14h8" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Save
        </button>
        <button id="exportBtn" class="btn btn--ghost">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Export
        </button>
      </div>
    </section>

    <section id="panel-history" class="panel">
      <ul id="historyList" class="list" style="margin-bottom: 10px;"></ul>
      <div class="toolbar" style="margin-top: 0;">
        <button id="clearHistoryBtn" class="btn btn--ghost" style="width: 100%;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 6h16M10 11v6M14 11v6M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
          Clear History
        </button>
      </div>
    </section>

    <div id="status" class="toast" hidden></div>

    <script src="accounts.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
